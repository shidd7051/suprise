
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Diwali</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    background: #17051f;
    color: white;
    overflow-x: hidden;
}

/* Main Section */
.hero {
    min-height: 100vh;
    background:
    radial-gradient(circle at 50% 50%, #57200d 0%, #260b27 45%, #10051b 100%);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow-x: hidden;
    overflow-y: auto;
    padding: 50px 30px;
}

/* Background Circles */
.circle {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(255, 190, 70, 0.3);
    animation: rotate 20s linear infinite;
}

.circle1 {
    width: 550px;
    height: 550px;
}

.circle2 {
    width: 700px;
    height: 700px;
    animation-direction: reverse;
}

@keyframes rotate {
    from {
        transform: rotate(0deg);
    }
    to {
        transform: rotate(360deg);
    }
}

/* Lights */
.light {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 8px;
    background: repeating-linear-gradient(
        90deg,
        #ffcc33 0px,
        #ffcc33 8px,
        transparent 8px,
        transparent 35px
    );
    box-shadow: 0 0 20px #ffae00;
}

/* Content */
.content {
    position: relative;
    z-index: 2;
    max-width: 800px;
    width: 100%;
}

.small-title {
    color: #ffcc5c;
    letter-spacing: 6px;
    font-size: 18px;
    margin-bottom: 25px;
}

/* Heading */
h1 {
    font-size: clamp(55px, 10vw, 110px);
    line-height: 1.1;
    font-weight: 900;
    background: linear-gradient(
        90deg,
        #fff3a6,
        #ffb000,
        #ff5e00,
        #fff0a0
    );
    -webkit-background-clip: text;
    color: transparent;
    text-shadow: 0 0 30px rgba(255, 150, 0, 0.25);
    transition: font-size 0.8s ease;
}

/* Button */
.btn {
    display: inline-block;
    padding: 15px 38px;
    border: none;
    border-radius: 50px;
    background: linear-gradient(45deg, #ff9d00, #ff3d00);
    color: white;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
    box-shadow: 0 0 25px #ff7900;
    transition: 0.4s;
}

.btn:hover {
    transform: translateY(-6px);
    box-shadow: 0 0 40px #ffae00;
}

/* Image Box */
.image-box {
    display: none;
    margin-top: 10px;
    animation: showImage 1s ease;
}

.image-box img {
    width: 350px;
    max-width: 100%;
    border-radius: 20px;
    box-shadow: 0 0 30px orange;
}

.image-box h2 {
    color: #ffcc33;
    margin-top: 15px;
    font-size: 25px;
}

.image-box p {
    margin-top: 10px;
    color: white;
}

/* Image Animation */
@keyframes showImage {
    from {
        opacity: 0;
        transform: scale(0.5);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

/* Diyas */
.diyas {
    display: flex;
    justify-content: center;
    gap: 55px;
    margin-top: 65px;
}

.diya {
    position: relative;
    width: 65px;
    height: 35px;
    background: linear-gradient(#ffcf47, #b83b00);
    border-radius: 0 0 50% 50%;
    box-shadow: 0 8px 20px #ff7000;
}

.diya::before {
    content: "";
    position: absolute;
    width: 17px;
    height: 27px;
    background: #fff5a5;
    border-radius: 50% 50% 50% 0;
    transform: rotate(45deg);
    top: -29px;
    left: 24px;
    box-shadow: 0 0 20px #ffbd22;
    animation: flame 0.8s infinite alternate;
}

@keyframes flame {
    from {
        transform: rotate(40deg) scale(0.9);
    }
    to {
        transform: rotate(50deg) scale(1.1);
    }
}

/* Stars */
.star {
    position: absolute;
    color: #ffcf54;
    font-size: 22px;
    animation: blink 1.5s infinite alternate;
}

.star1 {
    top: 20%;
    left: 15%;
}

.star2 {
    top: 35%;
    right: 15%;
}

.star3 {
    bottom: 20%;
    left: 12%;
}

.star4 {
    bottom: 15%;
    right: 12%;
}

@keyframes blink {
    from {
        opacity: 0.3;
        transform: scale(0.7);
    }
    to {
        opacity: 1;
        transform: scale(1.3);
    }
}

/* Footer */
footer {
    position: absolute;
    bottom: 20px;
    width: 100%;
    text-align: center;
    color: #d6a76b;
    font-size: 13px;
    z-index: 3;
    pointer-events: none;
}

/* Responsive */
@media(max-width: 600px) {

    .small-title {
        font-size: 13px;
        letter-spacing: 3px;
    }

    h2 {
        font-size: 23px;
    }

    .diyas {
        gap: 25px;
    }

    .circle1 {
        width: 300px;
        height: 300px;
    }

    .circle2 {
        width: 400px;
        height: 400px;
    }

    .image-box img {
        width: 280px;
    }

    footer {
        font-size: 10px;
    }
}

</style>
</head>

<body>

<section class="hero">

    <div class="light"></div>

    <div class="circle circle1"></div>
    <div class="circle circle2"></div>

    <span class="star star1">✦</span>
    <span class="star star2">✧</span>
    <span class="star star3">✦</span>
    <span class="star star4">✧</span>

    <div class="content">

        <p class="small-title">
            ✨ THE FESTIVAL OF LIGHTS ✨
        </p>

        <h1 id="diwaliTitle">
            HAPPY<br>DIWALI
        </h1>

        <br><br><br><br>

        <!-- Button -->
        <button class="btn" id="celebrateBtn">
            Celebrate Diwali ✨
        </button>

        <!-- Audio -->
        <audio id="diwaliSong" loop preload="auto">
            <source src="diwali-song.mp3" type="audio/mpeg">
        </audio>

        <!-- Image -->
        <div class="image-box" id="diwaliImage">

            <img
            src="diwali.png"
            alt="Happy Diwali">

            <h2>🪔 Happy Diwali 🪔</h2>

            <p>
                May your life shine with happiness and prosperity!
            </p>

        </div>

        <!-- Diyas -->
        <div class="diyas">
            <div class="diya"></div>
            <div class="diya"></div>
            <div class="diya"></div>
        </div>

    </div>

    <footer>
        © 2026 | Wishing You A Very Happy & Prosperous Diwali
    </footer>

</section>

<!-- JavaScript -->
<script>

let btn = document.getElementById("celebrateBtn");

let image = document.getElementById("diwaliImage");

let title = document.getElementById("diwaliTitle");

let song = document.getElementById("diwaliSong");


btn.addEventListener("click", function() {

    // Show Image
    image.style.display = "block";

    // Hide Button
    btn.style.display = "none";

    // Change Heading Size
    title.style.fontSize = "40px";

    // Play Music in Loop
    song.play().catch(function(error) {
        console.log("Music could not play:", error);
    });

});

</script>

</body>
</html>
